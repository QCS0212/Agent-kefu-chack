<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客服回复核验 · 检测报告</title>
<style>
:root{--bg:#f5f7fa;--paper:#fff;--ink:#172b3a;--muted:#596a79;--line:#e4eaf0;--accent:#0b756d;--danger:#bc4545;--blue:#416fbd;--amber:#987014}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}button,select,summary{cursor:pointer}button,a,input,select,summary{outline-offset:4px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent)}
.top{background:var(--paper);border-bottom:1px solid var(--line)}.top-inner{max-width:1240px;margin:auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:650}.mark{background:var(--accent);color:white;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}.muted{color:var(--muted)}.small{font-size:13px}main{max-width:1240px;margin:0 auto;padding:34px 28px 48px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{font-size:28px;line-height:1.3;letter-spacing:-.4px;margin:0 0 8px}h2{font-size:17px;margin:0}p{margin:0}button{background:var(--paper);border:1px solid #ccd7df;border-radius:8px;padding:10px 16px;min-height:44px;color:var(--ink)}button:hover{background:#edf3f5}.notice{border:1px solid #e5e1d5;background:#faf8f1;border-radius:10px;padding:13px 18px;margin-bottom:24px;color:#755a14}.notice strong{margin-right:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.stat,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px}.stat{padding:19px 22px}.stat-value{font-size:32px;font-weight:650;line-height:1.4;font-variant-numeric:tabular-nums;margin:6px 0}.stat-note{font-size:12px;color:var(--muted)}.charts{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;margin-bottom:24px}.panel-head{padding:21px 24px 0}.chart{height:250px;width:100%}.legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:0 20px 20px;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.evaluation{min-height:306px;display:flex;flex-direction:column}.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:8px}.empty-symbol{font-size:26px;color:#7c8f9e;background:#f2f5f8;border-radius:12px;width:52px;height:52px;display:grid;place-items:center;margin-bottom:5px}.metric-text{padding:0 24px 18px;font-size:13px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:22px 24px}.controls{display:flex;gap:10px;align-items:center}input,select{border:1px solid #cbd5de;background:white;border-radius:8px;padding:10px 12px;min-height:44px;color:var(--ink)}input{width:240px}label{font-size:13px;color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th{font-size:12px;color:var(--muted);font-weight:500;background:#f8fafb;padding:12px 24px}td{padding:17px 24px;border-top:1px solid var(--line);vertical-align:top}th:first-child{width:90px}th:nth-child(3){width:140px}th:last-child{width:220px}.question{font-weight:550;margin-bottom:4px}.reason{font-size:13px;color:var(--muted)}.pill{display:inline-block;border-radius:6px;padding:3px 9px;font-size:12px;white-space:nowrap}.pending{color:#7d6018;background:#fcf3d9}.hallucination{color:#a43838;background:#fff0ef}.no_hallucination{color:#315a9d;background:#edf3ff}.neutral{color:#506477;background:#edf2f6}details{margin-top:9px}summary{color:var(--accent);font-size:13px;min-height:32px;padding:4px 0}.detail{background:#f7f9fb;border-radius:8px;padding:14px;margin-top:8px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.detail dt{font-weight:650;margin-top:10px}.detail dt:first-child{margin-top:0}.detail dd{margin:4px 0 0;color:var(--muted)}.table-footer{padding:15px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:16px;margin-top:22px;font-size:12px;color:var(--muted)}footer a{color:var(--muted)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:760px){main{padding:24px 16px}.top-inner{padding:14px 16px}.heading{align-items:flex-start}h1{font-size:24px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px}.charts{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column;padding:18px}.controls{width:100%;flex-wrap:wrap}input{width:100%}.search-label{flex:1;min-width:150px}table{min-width:620px}td,th{padding:14px 18px}.notice strong{display:block}.top .small{display:none}footer{flex-direction:column}.heading button{white-space:nowrap;padding:8px 12px}}
@media print{button,.controls{display:none}.charts,.stats{break-inside:avoid}body{background:white}main{padding:10px}.table-wrap{overflow:visible}}
</style></head>
<body><header class="top"><div class="top-inner"><div class="brand"><span class="mark" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>客服回复核验<span class="pill neutral">检测报告</span></div><span class="small muted">批量质检</span></div></header>
<main><div class="heading"><div><h1>客服回复检测报告</h1><p id="subtitle" class="muted small"></p></div><button id="download">导出 JSON</button></div>
<div class="notice" id="notice"></div>
<section class="stats" aria-label="检测概览" id="stats"></section>
<section class="charts" aria-label="数据分析"><article class="panel"><div class="panel-head"><h2>判断分布</h2><p class="small muted">按本次检测结果统计</p></div><div class="chart" id="distribution" role="img" aria-label="判断分布图"></div><div class="legend" id="legend"></div></article>
<article class="panel evaluation"><div class="panel-head"><h2>检测效果</h2><p class="small muted">对照人工标注</p></div><div id="quality" class="chart" hidden role="img" aria-label="评估指标柱状图"></div><div id="metric-text" class="metric-text" hidden></div><div id="evaluation-empty" class="empty"><strong>还没有评估结果</strong><p class="muted small">完成真实检测与人工标注对照后，显示各项指标。</p></div></article></section>
<section class="panel"><div class="toolbar"><div><h2>回复明细</h2><p class="small muted">可查看原始回复和判断依据</p></div><div class="controls"><label class="search-label"><span class="sr">搜索案例</span><input id="search" type="search" placeholder="搜索 ID、问题或回复"></label><label><span class="sr">筛选判断</span><select id="filter"><option value="all">全部结果</option><option value="hallucination">存在幻觉</option><option value="no_hallucination">未发现幻觉</option><option value="not_verifiable">待核验</option></select></label></div></div>
<div class="table-wrap"><table><thead><tr><th scope="col">案例</th><th scope="col">用户问题 / 检测说明</th><th scope="col">判断</th><th scope="col">分类 / 严重程度</th></tr></thead><tbody id="rows"></tbody></table></div><p id="no-results" class="empty" hidden>没有找到匹配的回复，试试其他关键词。</p><div class="table-footer" id="count" aria-live="polite"></div></section>
<footer><span>统计范围：本次导入的回复。</span><a href="https://echarts.apache.org/" target="_blank" rel="noopener noreferrer">Apache ECharts</a></footer><noscript>请启用 JavaScript 查看交互报告；原始数据可在 predictions.json 中查看。</noscript></main>
<script>/*__ECHARTS__*/</script>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent), p=data.predictions, e=data.evaluation, source=data.sources;
const mock=p.mode==='mock', metrics=mock?null:e.metrics, rows=p.results;
if(!mock&&!metrics){document.getElementById('evaluation-empty').querySelector('strong').textContent='尚未提交人工标签';document.getElementById('evaluation-empty').querySelector('p').textContent='检测已完成，提交人工标签后可计算检出率等指标。';}
const names={hallucination:'存在幻觉',no_hallucination:'未发现幻觉',not_verifiable:'待核验'},colors={hallucination:'#bc4545',no_hallucination:'#416fbd',not_verifiable:'#b3913b'};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const counts=Object.fromEntries(Object.keys(names).map(k=>[k,rows.filter(r=>r.verdict===k).length]));
const $=id=>document.getElementById(id), number=v=>v==null?'—':(v*100).toFixed(1)+'%';
const date=new Date(p.created_at); $('subtitle').textContent=`${mock?'模拟运行（mock）':'检测记录'} · ${rows.length} 条样本 · ${isNaN(date)?'时间未记录':date.toLocaleString('zh-CN',{hour12:false})}`;
$('notice').innerHTML=mock?`<strong>模拟运行</strong>${rows.length} 条回复仅跑通处理流程，尚未判断是否存在幻觉。`:`<strong>评估说明</strong>${escapeHTML(e.note)}`;
const stats=[['回复总数',rows.length,'本次处理'],['存在幻觉',mock?'—':counts.hallucination,mock?'尚未检测':'需要关注的回复'],['待核验',counts.not_verifiable,'暂未得出结论'],['检出率',number(metrics?.recall),metrics?'已检出 / 人工标注的幻觉':'尚未评估']];
$('stats').innerHTML=stats.map(([a,b,c])=>`<article class="stat"><p class="small muted">${a}</p><div class="stat-value">${b}</div><p class="stat-note">${c}</p></article>`).join('');
$('legend').innerHTML=Object.entries(names).map(([k,n])=>`<span><i class="dot" style="background:${colors[k]}"></i>${n} <strong>${counts[k]}</strong></span>`).join('');
$('distribution').setAttribute('aria-label',Object.entries(names).map(([k,n])=>`${n}${counts[k]}条`).join('，'));
const charts=[];
if(window.echarts){
const chart=echarts.init($('distribution'),null,{renderer:'svg'});charts.push(chart);
chart.setOption({animation:!matchMedia('(prefers-reduced-motion: reduce)').matches,tooltip:{trigger:'item',renderMode:'richText',formatter:'{b}：{c} 条（{d}%）'},title:{text:String(rows.length),subtext:'条回复',left:'center',top:'34%',textStyle:{fontSize:32,fontWeight:600,color:'#172b3a'},subtextStyle:{fontSize:12,color:'#596a79'}},series:[{type:'pie',radius:['63%','78%'],center:['50%','48%'],label:{show:false},data:Object.entries(names).map(([k,n])=>({name:n,value:counts[k],itemStyle:{color:colors[k]}}))}]});
if(metrics){$('evaluation-empty').hidden=true;$('quality').hidden=false;$('metric-text').hidden=false;
const keys=['precision','recall','f1','accuracy'],labels=['精确率','召回率','F1','准确率'];
$('metric-text').textContent=keys.map((k,i)=>`${labels[i]} ${number(metrics[k])}`).join(' · ')+` ｜ TP ${metrics.tp} / FP ${metrics.fp} / FN ${metrics.fn} / TN ${metrics.tn}`;
const quality=echarts.init($('quality'),null,{renderer:'svg'});charts.push(quality);quality.setOption({animation:false,grid:{left:60,right:28,top:26,bottom:35},tooltip:{trigger:'axis',renderMode:'richText',valueFormatter:v=>v==null?'无定义':v+'%'},xAxis:{type:'category',data:labels,axisLine:{lineStyle:{color:'#dce4eb'}},axisTick:{show:false},axisLabel:{color:'#596a79'}},yAxis:{type:'value',max:100,axisLabel:{formatter:'{value}%',color:'#596a79'},splitLine:{lineStyle:{color:'#edf1f5'}}},series:[{type:'bar',barMaxWidth:40,itemStyle:{color:'#0b756d',borderRadius:[5,5,0,0]},label:{show:true,position:'top',formatter:o=>o.value==null?'—':o.value+'%'},data:keys.map(k=>metrics[k]==null?null:Number((metrics[k]*100).toFixed(1)))}]});}
const observer=new ResizeObserver(()=>charts.forEach(c=>c.resize()));observer.observe(document.querySelector('.charts'));
}else{$('distribution').textContent='图表加载失败，具体数量请查看下方文字统计。';}
function render(){const query=$('search').value.trim().toLowerCase(),filter=$('filter').value;const selected=rows.filter(r=>(filter==='all'||r.verdict===filter)&&JSON.stringify([r,source[r.id]||{}]).toLowerCase().includes(query));
$('rows').innerHTML=selected.map(r=>{const s=source[r.id]||{},state=r.verdict==='not_verifiable'?'pending':r.verdict;
const severity={high:'高',medium:'中',low:'低'}[r.severity]||'—';
const claims=(r.claims||[]).map(c=>`<dt>声明 · ${escapeHTML({supported:'有依据',contradicted:'与知识冲突',unsupported:'无依据',not_verifiable:'不可核验'}[c.relation]||c.relation)}</dt><dd>${escapeHTML(c.reply_quote)}<br>依据：${escapeHTML(c.knowledge_quote||'未提供')} ${escapeHTML(c.reason||'')}</dd>`).join('');
return `<tr><td class="muted">${escapeHTML(r.id)}</td><td><div class="question">${escapeHTML(s.user_question||'核验记录')}</div><div class="reason">${escapeHTML(mock?'尚未进行事实核验':r.reason)}</div><details><summary>查看详情</summary><dl class="detail"><dt>客服回复</dt><dd>${escapeHTML(s.system_reply||'本报告未附带原始回复')}</dd><dt>知识依据</dt><dd>${escapeHTML(s.knowledge_base||'本报告未附带原始知识')}</dd>${claims}</dl></details></td><td><span class="pill ${escapeHTML(state)}">${escapeHTML(names[r.verdict]||r.verdict)}</span></td><td><div>${escapeHTML((r.types||[]).map(t=>data.categories[t]||t).join('、')||'—')}</div><div class="small muted">严重程度：${severity}</div></td></tr>`}).join('');$('no-results').hidden=selected.length!==0;$('count').textContent=`共 ${rows.length} 条，当前显示 ${selected.length} 条 · 图表按全部回复统计`;}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);render();
$('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`predictions-${p.mode}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script></body></html>
